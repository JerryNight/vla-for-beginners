<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" role="img" aria-label="一个 7 维机器人动作向量的构成">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif; }
      .sym { font-size: 17px; font-weight: 600; fill: #1f2937; }
      .mean { font-size: 11px; fill: #4b5563; }
      .grp { font-size: 11.5px; font-weight: 600; fill: #374151; }
      .note { font-size: 10.5px; fill: #6b7280; }
      .word { font-size: 11px; fill: #6b7280; }
    </style>
  </defs>

  <!-- 组标签 -->
  <text class="grp" x="201" y="40" text-anchor="middle">位移（米）</text>
  <text class="grp" x="468" y="40" text-anchor="middle">旋转（弧度）</text>
  <text class="grp" x="646" y="40" text-anchor="middle">夹爪</text>

  <!-- 位移 -->
  <g fill="#dbeafe" stroke="#60a5fa" stroke-width="1.3">
    <rect x="70" y="55" width="84" height="82" rx="7"/>
    <rect x="159" y="55" width="84" height="82" rx="7"/>
    <rect x="248" y="55" width="84" height="82" rx="7"/>
  </g>
  <text class="sym" x="112" y="93" text-anchor="middle">Δx</text>
  <text class="mean" x="112" y="118" text-anchor="middle">前后</text>
  <text class="sym" x="201" y="93" text-anchor="middle">Δy</text>
  <text class="mean" x="201" y="118" text-anchor="middle">左右</text>
  <text class="sym" x="290" y="93" text-anchor="middle">Δz</text>
  <text class="mean" x="290" y="118" text-anchor="middle">上下</text>

  <!-- 旋转 -->
  <g fill="#ede9fe" stroke="#a78bfa" stroke-width="1.3">
    <rect x="337" y="55" width="84" height="82" rx="7"/>
    <rect x="426" y="55" width="84" height="82" rx="7"/>
    <rect x="515" y="55" width="84" height="82" rx="7"/>
  </g>
  <text class="sym" x="379" y="93" text-anchor="middle">Δrx</text>
  <text class="mean" x="379" y="118" text-anchor="middle">翻滚</text>
  <text class="sym" x="468" y="93" text-anchor="middle">Δry</text>
  <text class="mean" x="468" y="118" text-anchor="middle">俯仰</text>
  <text class="sym" x="557" y="93" text-anchor="middle">Δrz</text>
  <text class="mean" x="557" y="118" text-anchor="middle">偏航</text>

  <!-- 夹爪 -->
  <rect x="604" y="55" width="84" height="82" rx="7" fill="#dcfce7" stroke="#4ade80" stroke-width="1.3"/>
  <text class="sym" x="646" y="93" text-anchor="middle">g</text>
  <text class="mean" x="646" y="118" text-anchor="middle">开 / 合</text>

  <!-- 分组括号 -->
  <path d="M70,44 H332" stroke="#93c5fd" stroke-width="1.2" fill="none"/>
  <path d="M337,44 H599" stroke="#c4b5fd" stroke-width="1.2" fill="none"/>
  <path d="M604,44 H688" stroke="#86efac" stroke-width="1.2" fill="none"/>

  <!-- 底部说明 -->
  <text class="note" x="70" y="168">每一维都是一个连续实数，不是「选一个词」——这是 VLA 和语言模型最根本的差别</text>

  <text class="word" x="70" y="200">绝对动作：</text>
  <text class="note" x="140" y="200">「去坐标 (0.42, 0.11, 0.30)」 —— 坐标系一变就失效，且要精确知道自己在哪</text>
  <text class="word" x="70" y="222">相对动作：</text>
  <text class="note" x="140" y="222">「往前 2 毫米，夹爪闭上」 —— 更常用；错了还能下一步修回来</text>
</svg>
